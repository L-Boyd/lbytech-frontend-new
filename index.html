<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习笔记展示平台</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="marked.min.js"></script>
    <script src="highlight.min.js"></script>
    <link rel="stylesheet" href="highlight.css">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var commentToggleBtn = document.getElementById('commentToggleBtn');
            var commentPanel = document.getElementById('commentPanel');
            var closeCommentBtn = document.getElementById('closeCommentBtn');
            var submitCommentBtn = document.getElementById('submitCommentBtn');
            var commentInput = document.getElementById('commentInput');
            var aiChatPanel = document.getElementById('aiChatPanel');
            
            function updateCommentButtonPosition() {
                if (aiChatPanel && !aiChatPanel.classList.contains('hidden')) {
                    commentToggleBtn.style.right = '760px';
                } else {
                    commentToggleBtn.style.right = '380px';
                }
            }
            
            if (commentToggleBtn && commentPanel) {
                console.log('找到评论按钮和评论面板');
                
                commentToggleBtn.onclick = function(e) {
                    console.log('评论按钮被点击');
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (commentPanel.classList.contains('hidden')) {
                        commentPanel.classList.remove('hidden');
                        console.log('评论面板已显示');
                    } else {
                        commentPanel.classList.add('hidden');
                        console.log('评论面板已隐藏');
                    }
                    updateCommentButtonPosition();
                };
            } else {
                console.log('未找到评论按钮或评论面板');
                console.log('commentToggleBtn:', commentToggleBtn);
                console.log('commentPanel:', commentPanel);
            }
            
            if (closeCommentBtn && commentPanel) {
                closeCommentBtn.onclick = function(e) {
                    console.log('关闭按钮被点击');
                    e.preventDefault();
                    e.stopPropagation();
                    commentPanel.classList.add('hidden');
                    console.log('评论面板已关闭');
                    updateCommentButtonPosition();
                };
            }
            
            if (submitCommentBtn && commentInput) {
                submitCommentBtn.onclick = function(e) {
                    var content = commentInput.value.trim();
                    if (content) {
                        console.log('提交评论:', content);
                        if (typeof submitComment === 'function') {
                            submitComment();
                        }
                    }
                };
            }
            
            if (aiChatPanel) {
                var observer = new MutationObserver(function() {
                    updateCommentButtonPosition();
                });
                observer.observe(aiChatPanel, { attributes: true, attributeFilter: ['class'] });
            }
            
            var refreshCommentBtn = document.getElementById('refreshCommentBtn');
            if (refreshCommentBtn) {
                refreshCommentBtn.onclick = function(e) {
                    console.log('刷新评论');
                    e.preventDefault();
                    e.stopPropagation();
                    if (typeof loadComments === 'function') {
                        currentCommentPage = 1;
                        loadComments(currentNoteId);
                    }
                };
            }
            
            var loadMoreBtn = document.getElementById('loadMoreBtn');
            if (loadMoreBtn) {
                loadMoreBtn.onclick = function(e) {
                    console.log('加载更多评论');
                    e.preventDefault();
                    e.stopPropagation();
                    if (typeof loadMoreComments === 'function') {
                        loadMoreComments();
                    }
                };
            }
            
            document.addEventListener('click', function(e) {
                var deleteBtn = e.target.closest('.comment-delete-btn');
                var likeBtn = e.target.closest('.comment-like-btn');
                
                if (deleteBtn) {
                    var commentId = deleteBtn.getAttribute('data-comment-id');
                    console.log('删除评论:', commentId);
                    if (typeof deleteComment === 'function') {
                        deleteComment(commentId);
                    }
                }
                
                if (likeBtn) {
                    var commentId = likeBtn.getAttribute('data-comment-id');
                    console.log('点赞评论:', commentId);
                    if (typeof likeComment === 'function') {
                        likeComment(commentId);
                    }
                }
            });
        });
    </script>
</head>
<body>
    <!-- 登录模态框 -->
    <div id="loginModal" class="modal active">
        <div class="modal-content">
            <h2>欢迎登录lbytech笔记网站</h2>
            
            <!-- 登录方式切换选项卡 -->
            <div class="login-tabs">
                <button id="tabCode" class="tab-btn" data-tab="code">邮箱验证码登录</button>
                <button id="tabPassword" class="tab-btn active" data-tab="password">邮箱密码登录</button>
            </div>
            
            <div class="form-group">
                <label for="email">邮箱</label>
<input type="email" id="email" placeholder="请输入邮箱地址" required>
            </div>
            
            <!-- 验证码登录表单 -->
            <div id="codeLoginForm" class="login-form">
                <div class="form-group">
                    <label for="code">验证码</label>
                    <div class="code-input-group">
                        <input type="text" id="code" placeholder="请输入验证码" required>
                        <button id="sendCode" class="btn-code">发送验证码</button>
                    </div>
                </div>
            </div>
            
            <!-- 密码登录表单 -->
            <div id="passwordLoginForm" class="login-form active">
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group" style="text-align: right;">
                    <a href="#" id="forgotPasswordLink" style="font-size: 14px; color: #3498db; text-decoration: none;">忘记密码？</a>
                </div>
            </div>
            
            <button id="loginBtn" class="btn-primary">登录</button>
            <p id="loginError" class="error-message"></p>
            <div class="register-link">
                <span>还没有账号？</span>
                <a href="#" id="registerLink">立即注册</a>
            </div>
        </div>
    </div>
    
    <!-- 注册模态框 -->
    <div id="registerModal" class="modal hidden">
        <div class="modal-content">
            <h2>账号注册</h2>
            
            <div class="form-group">
                <label for="registerEmail">邮箱</label>
                <input type="email" id="registerEmail" placeholder="请输入邮箱地址" required>
            </div>
            
            <div class="form-group">
                <label for="registerPassword">密码</label>
                <input type="password" id="registerPassword" placeholder="请输入密码" required>
            </div>
            
            <div class="form-group">
                <label for="registerVerifyCode">验证码</label>
                <div class="code-input-group">
                    <input type="text" id="registerVerifyCode" placeholder="请输入验证码" required>
                    <button id="sendRegisterVerifyCode" class="btn-code">发送验证码</button>
                </div>
            </div>
            
            <button id="registerBtn" class="btn-primary">注册</button>
            <p id="registerError" class="error-message"></p>
            <div class="login-link">
                <span>已有账号？</span>
                <a href="#" id="backToLogin">返回登录</a>
            </div>
        </div>
    </div>

    <!-- 忘记密码模态框 -->
    <div id="forgotPasswordModal" class="modal hidden">
        <div class="modal-content">
            <h2>重置密码</h2>
            
            <div class="form-group">
                <label for="forgotEmail">邮箱</label>
                <input type="email" id="forgotEmail" placeholder="请输入注册时的邮箱地址" required>
            </div>
            
            <div class="form-group">
                <label for="forgotVerifyCode">验证码</label>
                <div class="code-input-group">
                    <input type="text" id="forgotVerifyCode" placeholder="请输入验证码" required>
                    <button id="sendForgotVerifyCode" class="btn-code">发送验证码</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="请输入新密码" required>
            </div>
            
            <button id="changePasswordBtn" class="btn-primary">确认修改</button>
            <p id="forgotPasswordError" class="error-message"></p>
            <div class="login-link">
                <span></span>
                <a href="#" id="backToLoginFromForgot">返回登录</a>
            </div>
        </div>
    </div>

    <!-- 主容器 -->
    <div id="mainContainer" class="hidden">
        <!-- 顶部导航栏 -->
        <header>
            <h1>学习笔记平台</h1>
            <!-- 搜索框 -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索笔记...">
                <button id="searchBtn" class="search-btn">搜索</button>
                <div id="searchResults" class="search-results hidden"></div>
            </div>
            <div class="header-right">
                <!-- 笔记上传按钮 -->
                <div class="notebook-uploader">
                    <input type="file" id="notebookFileInput" accept=".md,.txt,.json" style="display: none;">
                    <button id="uploadNotebookBtn" class="btn-upload">上传笔记</button>
                </div>
                <!-- 笔记选择下拉框 -->
                <div class="notebook-selector">
                    <select id="notebookDropdown" onchange="handleNotebookSelect()">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </select>
                </div>
                <!-- 点赞按钮 -->
                <div id="thumbContainer" class="thumb-container">
                    <button id="thumbBtn" class="thumb-btn">
                        <span id="thumbIcon" class="thumb-icon">👍</span>
                        <span id="thumbCount" class="thumb-count">0</span>
                    </button>
                </div>
                <!-- 用户信息 -->
                <div class="user-info">
                    <div class="dropdown">
                        <span id="userEmail" class="dropdown-toggle"></span>
                        <div id="userDropdown" class="dropdown-menu hidden">
                            <button id="showFullAccountBtn" class="dropdown-item">显示完整账号</button>
                            <button id="logoutBtn" class="dropdown-item">退出</button>
                        </div>
                    </div>
                </div>
                <!-- AI聊天按钮 -->
                <button id="aiChatToggleBtn" class="ai-chat-toggle-btn" title="AI助手">
                    <span class="ai-icon">🤖</span>
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="content-wrapper">
            <!-- 左侧导航 -->
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h2>目录索引</h2>
                </div>
                <nav id="noteNav">
                    <ul id="navList">
                        <!-- 笔记索引将通过JavaScript动态生成 -->
                    </ul>
                </nav>
            </aside>
            <!-- 侧边栏牵拉条 -->
            <div id="sidebar-resizer" class="sidebar-resizer"></div>

            <!-- AI聊天面板 -->
            <aside id="aiChatPanel" class="ai-chat-panel hidden">
                <div id="chatResizer" class="chat-resizer"></div>
                <div class="ai-chat-header">
                    <h3>AI 助手</h3>
                    <div class="ai-chat-controls">
                        <select id="modelSelect" class="model-select">
                            <option value="QWEN">Qwen</option>
                            <option value="DEEPSEEK">DeepSeek</option>
                        </select>
                        <button id="ragToggleBtn" class="rag-toggle-btn" title="切换RAG模式">
                            <span class="rag-icon">📚</span>
                            <span class="rag-label">RAG</span>
                        </button>
                        <button id="closeChatBtn" class="close-chat-btn" title="关闭聊天">×</button>
                    </div>
                </div>
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-container">
                    <textarea id="chatInput" class="chat-input" placeholder="输入消息..." rows="1"></textarea>
                    <button id="sendChatBtn" class="send-chat-btn">发送</button>
                </div>
            </aside>

            <!-- 右侧内容 -->
            <main id="content">
                <div id="markdownContent">
                    <!-- Markdown内容将在这里渲染 -->
                </div>
            </main>
            
            <!-- 评论按钮 -->
            <button id="commentToggleBtn" class="comment-toggle-btn" title="查看评论">
                <span>💬</span>
                <span class="comment-btn-label">评论</span>
            </button>
            
            <!-- 评论面板 -->
            <aside id="commentPanel" class="comment-panel hidden">
                <div class="comment-panel-header">
                    <h3>评论</h3>
                    <div class="comment-header-actions">
                        <button id="refreshCommentBtn" class="comment-action-btn" title="刷新评论">🔄</button>
                        <span id="commentCount" class="comment-count">0 条评论</span>
                        <button id="closeCommentBtn" class="close-comment-btn" title="关闭">×</button>
                    </div>
                </div>
                
                <!-- 添加评论表单 -->
                <div class="comment-form">
                    <textarea id="commentInput" class="comment-input" placeholder="写下你的评论..." rows="3"></textarea>
                    <button id="submitCommentBtn" class="submit-comment-btn">发表评论</button>
                </div>
                
                <!-- 评论列表 -->
                <div id="commentList" class="comment-list">
                    <!-- 评论将在这里渲染 -->
                </div>
                
                <!-- 加载更多按钮 -->
                <div id="loadMoreComments" class="load-more-comments hidden">
                    <button id="loadMoreBtn" class="load-more-btn">加载更多</button>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
    
    <!-- 备案信息 - 独立显示在页面底部 -->
    <footer class="icp-footer">
        <div class="beian-container">
            <a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备2025382516号-1</a>
            <span class="separator">|</span>
            <a href="https://beian.mps.gov.cn/#/query/webSearch?code=44030002006266" rel="noreferrer" target="_blank">
                <img src="备案图标.png" alt="公安备案" class="beian-icon">
                粤公网安备44030002006266号
            </a>
        </div>
    </footer>
</body>
</html>
